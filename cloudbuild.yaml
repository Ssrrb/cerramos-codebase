substitutions:
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: cerramos
  _SERVICE_ACCOUNT_NAME: cerramos-cloud-run
  _APP_SERVICE: cerramos-app
  _WEB_SERVICE: cerramos-web
  _API_SERVICE: cerramos-api
  _APP_URL: https://cerramos-app.example.com
  _WEB_URL: https://cerramos-web.example.com
  _API_URL: https://cerramos-api.example.com
  _DOCS_URL: https://docs.example.com
  _GCS_BUCKET_NAME: cerramos-assets
  _DATABASE_URL_SECRET: cerramos-database-url
  _BETTER_AUTH_SECRET_NAME: cerramos-better-auth-secret

steps:
  - id: build-app
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - APP=app
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_WEB_URL=${_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_DOCS_URL=${_DOCS_URL}
      - --build-arg
      - BETTER_AUTH_URL=${_APP_URL}
      - --build-arg
      - GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}
      - --build-arg
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-app:$SHORT_SHA
      - .

  - id: push-app
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-app:$SHORT_SHA
    waitFor:
      - build-app

  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_APP_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-app:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --service-account=${_SERVICE_ACCOUNT_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_TELEMETRY_DISABLED=1,NEXT_PUBLIC_APP_URL=${_APP_URL},NEXT_PUBLIC_WEB_URL=${_WEB_URL},NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_DOCS_URL=${_DOCS_URL},BETTER_AUTH_URL=${_APP_URL},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_NAME}:latest
    waitFor:
      - push-app

  - id: build-web
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - APP=web
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_WEB_URL=${_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_DOCS_URL=${_DOCS_URL}
      - --build-arg
      - BETTER_AUTH_URL=${_APP_URL}
      - --build-arg
      - GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}
      - --build-arg
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-web:$SHORT_SHA
      - .

  - id: push-web
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-web:$SHORT_SHA
    waitFor:
      - build-web

  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_WEB_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-web:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --service-account=${_SERVICE_ACCOUNT_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_TELEMETRY_DISABLED=1,NEXT_PUBLIC_APP_URL=${_APP_URL},NEXT_PUBLIC_WEB_URL=${_WEB_URL},NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_DOCS_URL=${_DOCS_URL},BETTER_AUTH_URL=${_APP_URL},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_NAME}:latest
    waitFor:
      - push-web

  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - APP=api
      - --build-arg
      - NEXT_PUBLIC_APP_URL=${_APP_URL}
      - --build-arg
      - NEXT_PUBLIC_WEB_URL=${_WEB_URL}
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg
      - NEXT_PUBLIC_DOCS_URL=${_DOCS_URL}
      - --build-arg
      - BETTER_AUTH_URL=${_APP_URL}
      - --build-arg
      - GCS_BUCKET_NAME=${_GCS_BUCKET_NAME}
      - --build-arg
      - GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-api:$SHORT_SHA
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-api:$SHORT_SHA
    waitFor:
      - build-api

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --service-account=${_SERVICE_ACCOUNT_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-env-vars=NODE_ENV=production,HOSTNAME=0.0.0.0,NEXT_TELEMETRY_DISABLED=1,NEXT_PUBLIC_APP_URL=${_APP_URL},NEXT_PUBLIC_WEB_URL=${_WEB_URL},NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_DOCS_URL=${_DOCS_URL},BETTER_AUTH_URL=${_APP_URL},GCS_BUCKET_NAME=${_GCS_BUCKET_NAME},GOOGLE_CLOUD_PROJECT=$PROJECT_ID
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,BETTER_AUTH_SECRET=${_BETTER_AUTH_SECRET_NAME}:latest
    waitFor:
      - push-api

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-app:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/cerramos-api:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
